# A Noctalia template for a godoist theme file. Noctalia fills in the colors and writes
# the result to ~/.config/godoist/themes/noctalia.toml. See "Theme files" in the README.
background = "{{colors.terminal_background.default.hex}}"
foreground = "{{colors.on_surface.default.hex}}"
accent     = "{{colors.primary.default.hex}}"
border     = "{{colors.outline_variant.default.hex}}"
selection  = "{{colors.primary.default.hex}}"
success    = "{{colors.terminal_normal_green.default.hex}}"
dimmed     = "{{colors.outline.default.hex}}"
error      = "{{colors.error.default.hex}}"
